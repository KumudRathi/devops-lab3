input {
  beats {
    port => 5044
  }
}

filter {
  if [message] {
    mutate {
      add_field => { "lab" => "devops-lab3" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "devops-lab3-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
